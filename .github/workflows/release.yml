name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Package
        id: package
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must look like v0.1.0."
          }
          $version = $Matches.version
          ./scripts/package.ps1 -Version $version
          $hash = (Get-FileHash -Algorithm SHA256 "artifacts/pbw_${version}_windows_x64.zip").Hash.ToLowerInvariant()
          "version=$version" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "zip=artifacts/pbw_${version}_windows_x64.zip" >> $env:GITHUB_OUTPUT
          "checksum=artifacts/pbw_${version}_windows_x64.zip.sha256" >> $env:GITHUB_OUTPUT

      - name: Update Scoop manifest
        shell: pwsh
        env:
          PBW_VERSION: ${{ steps.package.outputs.version }}
          PBW_HASH: ${{ steps.package.outputs.hash }}
        run: |
          $manifestPath = "scoop/pbw.json"
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $manifest.version = $env:PBW_VERSION
          $manifest.architecture.'64bit'.url = "https://github.com/mkusaka/pbw/releases/download/v$env:PBW_VERSION/pbw_$env:PBW_VERSION`_windows_x64.zip"
          $manifest.architecture.'64bit'.hash = $env:PBW_HASH
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 $manifestPath

      - name: Commit Scoop manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ((git status --short scoop/pbw.json) -eq "") {
            Write-Output "Scoop manifest is already current."
            return
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoop/pbw.json
          git commit -m "Update Scoop manifest for $env:TAG_NAME"
          git push "https://x-access-token:$env:GH_TOKEN@github.com/mkusaka/pbw.git" HEAD:main

      - name: Write release notes
        shell: pwsh
        env:
          PBW_VERSION: ${{ steps.package.outputs.version }}
        run: |
          @"
          pbw $env:PBW_VERSION

          Windows x64 self-contained CLI build.

          Install with Scoop:

          ````powershell
          scoop install https://raw.githubusercontent.com/mkusaka/pbw/main/scoop/pbw.json
          ````

          Or download ``pbw_${env:PBW_VERSION}_windows_x64.zip`` and place ``pbw.exe`` on PATH.
          "@ | Set-Content -Encoding UTF8 release-notes.md

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum }}
        run: |
          gh release create "$env:TAG_NAME" `
            "$env:ZIP_PATH" `
            "$env:CHECKSUM_PATH" `
            --title "$env:TAG_NAME" `
            --notes-file release-notes.md
